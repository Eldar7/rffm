name: Deploy RFFM site to GitHub Pages

# Rebuilds the static GitHub Pages site from the CSVs already committed
# under output/processed/rffm/ (analysis_scripts/build_site.py) and
# publishes it. Also rebuilds site/data/parquet/ (analysis_scripts/
# build_parquet.py) — compact Parquet tables for the planned duckdb-wasm
# frontend; not consumed by any report yet, but ships alongside the JSON
# so it's ready when that lands. Never scrapes rffm.es and never writes
# back to the repo - entirely separate from rffm-crawl.yml/crawl-all.yml.
# configure-pages'
# enablement:true asks it to switch Pages to "Source: GitHub Actions"
# itself on first run; if the token lacks permission for that, it still
# needs doing once by hand in repo Settings > Pages.
#
# Triggers: manual dispatch any time, plus a daily cron so the published
# site stays in sync with whatever the crawl workflows have committed
# since the last run.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild players.parquet
        # output/processed/rffm_parquet/players.parquet is deliberately
        # gitignored (see .gitignore / build_parquet.py docstring) - every
        # other table under rffm_parquet/ is committed by parquet-build.yml
        # and present on checkout, but this one is regenerated from the
        # git-tracked players_current.csv. build_site.py's v2/* pages (e.g.
        # weird_scores_report_v2.py) read it via rffm_data.py and fail with
        # FileNotFoundError on a fresh checkout without this step. Fast:
        # --players-only skips the full per-season CSV scan.
        run: python analysis_scripts/build_parquet.py --output-dir output/processed/rffm_parquet --players-only

      - name: Build site
        run: python analysis_scripts/build_site.py --output-dir site

      - name: Build Parquet tables
        run: python analysis_scripts/build_parquet.py --output-dir site/data/parquet

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
