name: RFFM crawl-all (orchestrator)
run-name: "crawl-all: ${{ inputs.hint_label || (inputs.dry_run && 'dry-run' || 'live') }}"

# Self-chaining orchestrator: runs one crawl step at a time by calling
# rffm-crawl.yml via workflow_call (job-level, synchronous), then
# re-dispatches itself for the next step. Each "link" in the chain covers
# exactly one stage (≤5h), so the 6h job timeout is never an issue.
#
# Chain is safe to interrupt at any point — next_crawl_step.py reads
# coverage_manifest.csv on every start and skips already-complete steps,
# so re-dispatching manually continues exactly where it stopped.
#
# NOTE: reusable workflows (workflow_call) can only be invoked at the JOB
# level, not as a step. Hence three jobs: compute → run-crawl → chain.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the next step without actually running it"
        required: false
        type: boolean
        default: false
      hint_label:
        description: "Human-readable label for the run (set by chain job, e.g. 'acta_partido 2025-2026 / ALEVIN')"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write   # needed to dispatch itself (gh workflow run)

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      done:           ${{ steps.next.outputs.done }}
      season:         ${{ steps.next.outputs.season }}
      stage:          ${{ steps.next.outputs.stage }}
      scope:          ${{ steps.next.outputs.scope }}
      all_categories: ${{ steps.next.outputs.all_categories }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute next step
        id: next
        run: |
          pip install pandas --quiet
          output=$(python .github/scripts/next_crawl_step.py)
          if [ -z "$output" ]; then
            echo "All steps complete — nothing left to crawl."
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "## crawl-all: done" >> "$GITHUB_STEP_SUMMARY"
            echo "All steps complete — nothing left to crawl." >> "$GITHUB_STEP_SUMMARY"
          else
            IFS='|' read -r season stage scope all_cat done_count total_count <<< "$output"
            echo "season=$season"          >> "$GITHUB_OUTPUT"
            echo "stage=$stage"            >> "$GITHUB_OUTPUT"
            echo "scope=$scope"            >> "$GITHUB_OUTPUT"
            echo "all_categories=$all_cat" >> "$GITHUB_OUTPUT"
            echo "done=false"              >> "$GITHUB_OUTPUT"
            echo "Next: season=$season stage=$stage scope=${scope:-ALL} all_categories=$all_cat ($done_count/$total_count steps done)"
            {
              echo "## crawl-all: $stage $season / ${scope:-ALL} ($done_count/$total_count)"
              echo "| field | value |"
              echo "|---|---|"
              echo "| season | \`$season\` |"
              echo "| stage | \`$stage\` |"
              echo "| scope | \`${scope:-ALL}\` |"
              echo "| all_categories | \`$all_cat\` |"
              echo "| progress | \`$done_count / $total_count steps\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  run-crawl:
    needs: compute
    # workflow_call can only be used at job level, not as a step.
    # Skip entirely on dry_run or when nothing is left.
    if: needs.compute.outputs.done == 'false' && inputs.dry_run != true
    uses: ./.github/workflows/rffm-crawl.yml
    with:
      season_label:   ${{ needs.compute.outputs.season }}
      stage:          ${{ needs.compute.outputs.stage }}
      scope_category: ${{ needs.compute.outputs.scope }}
      all_categories: ${{ needs.compute.outputs.all_categories == 'true' }}
    permissions:
      contents: write

  chain:
    needs: [compute, run-crawl]
    # always() so this runs even if run-crawl failed or was cancelled —
    # next_crawl_step.py will re-queue the same step since manifest is still
    # partial. Skip only when everything is done or this is a dry run.
    if: always() && needs.compute.outputs.done == 'false' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute hint label for next run
        id: hint
        run: |
          pip install pandas --quiet
          output=$(python .github/scripts/next_crawl_step.py || true)
          if [ -n "$output" ]; then
            IFS='|' read -r season stage scope all_cat _done _total <<< "$output"
            scope_display="${scope:-ALL}"
            if [ "$stage" = "core" ] || [ "$stage" = "clubs" ]; then
              scope_display="ALL"
            fi
            echo "label=${stage} ${season} / ${scope_display}" >> "$GITHUB_OUTPUT"
          else
            echo "label=done" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch next crawl-all run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run crawl-all.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME" \
              --field dry_run=false \
              --field "hint_label=${{ steps.hint.outputs.label }}"; then
              echo "Dispatched next crawl-all run (attempt $attempt)."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed, retrying..."
            sleep $((attempt * 10))
          done
          echo "::error::Failed to dispatch next crawl-all run after 3 attempts. Re-run manually to continue."
          exit 1
