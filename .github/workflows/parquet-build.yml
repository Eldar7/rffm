name: Build and commit Parquet tables

# Runs analysis_scripts/build_parquet.py against the CSVs already committed
# under output/processed/rffm/ and commits its output to
# output/processed/rffm_parquet/ — a lossless, ~27x smaller copy of the
# same data (see analysis_scripts/build_parquet.py's docstring for the
# column/type rules and site/DATA_DICTIONARY.md's normalization notes for
# why players.csv alone gets deduped).
#
# Deliberately parallel, not a replacement: output/processed/rffm/ (the
# CSVs) is never read-write here beyond checkout, never modified, never
# deleted. This workflow only ever adds/updates files under
# output/processed/rffm_parquet/, so the old data and the old site
# (pages-deploy.yml, entirely CSV-driven) are unaffected either way.
#
# Only CLOSED (season, stage) Parquet files get committed - see
# analysis_scripts/parquet_closure.py's module docstring for the full
# open/closed policy. build_parquet.py still builds every table for every
# season into the runner's local output-dir (site-build/query code needs
# all of it), but this workflow's git-add step only stages the subset
# parquet_closure.py --list-committable says is closed, so an in-progress
# season/stage never gets a committed Parquet snapshot (and never needs
# one - see build_parquet.py's --players-only precedent, which this
# generalizes: a table nobody has closed yet is regenerated on demand by
# whatever build/session needs it, not persisted to git history).
#
# Closing a (season, stage) - committing its final Parquet AND deleting
# its source CSV in the same action - is a SEPARATE, deliberately manual
# step (project owner's explicit instruction: never automatic, only on
# explicit request) - not something this workflow does on its own, ever.
#
# Manual dispatch only for now (no cron) until the migration is verified
# end to end - see the "v2" site build in pages-deploy.yml that renders
# the same reports from this Parquet copy for comparison against the
# CSV-driven original.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: parquet-build
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Parquet tables
        run: python analysis_scripts/build_parquet.py --output-dir output/processed/rffm_parquet

      - name: Commit and push to main
        run: |
          git config user.name "rffm-parquet-bot"
          git config user.email "actions@github.com"

          python analysis_scripts/parquet_closure.py --list-committable | xargs -r git add
          if git diff --cached --quiet; then
            echo "No changes to commit (nothing newly closed since the last run)."
            exit 0
          fi
          git commit -m "parquet-build: refresh closed-season Parquet tables"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push output/processed/rffm_parquet after retries."
          exit 1
